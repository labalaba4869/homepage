<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>游戏详情</title>
    <link rel="stylesheet" href="play.css" />
  </head>
  <body>
    <div class="play-shell">
      <header class="play-header">
        <a class="back-link" href="../index.html">← 返回首页</a>
      </header>

      <!-- 顶部：标题区（横跨整行） -->
      <section class="block title-block" aria-busy="true" id="titleBlock">
        <h1 id="gameTitle">加载中…</h1>
        <p class="subtitle" id="gameSubtitle"></p>
        <p class="type-tag" id="gameTypeTag"></p>
      </section>

      <!-- 中部：游戏画面（横跨整行，尺寸放大） -->
      <section class="block game-block">
        <div class="game-frame-wrap">
          <iframe id="gameFrame" src="" allowfullscreen title="游戏画面"></iframe>
          <button class="game-zoom-btn" id="gameZoomBtn" type="button" aria-label="放大游戏画面">放大全屏</button>
        </div>
        <p class="game-hint">点击上方画面或「放大全屏」可进入全屏体验，按 ESC 退出。</p>
      </section>

      <!-- 底部：两列 — 左=更新日志 / 右上方=操作方式+更新计划 / 右下方=玩家反馈 -->
      <div class="play-grid">
        <section class="col col-left">
          <div class="block changelog-block">
            <h2>更新日志</h2>
            <ul class="changelog-list" id="changelogList"></ul>
          </div>
        </section>

        <section class="col col-right">
          <div class="block ops-block">
            <h2>操作方式</h2>
            <ul class="info-list" id="controlsList"></ul>

            <h2>更新计划</h2>
            <ul class="info-list" id="roadmapList"></ul>
          </div>

          <div class="block comments-block">
            <h2>玩家反馈</h2>
            <p class="comment-hint">需要 GitHub 账号登录后才能留言。我作为仓库维护者可以删除或恢复任何评论，所有人也能看到所有反馈。</p>
            <div id="giscusContainer"></div>
          </div>
        </section>
      </div>

      <div id="loadError" class="load-error" hidden>
        <p>没有找到对应的游戏数据，请确认链接是否正确。</p>
        <a href="../index.html">← 返回首页</a>
      </div>
    </div>

    <!-- Lightbox：全屏游戏 -->
    <div class="lightbox" id="lightbox" aria-hidden="true">
      <button class="lightbox-close" id="lightboxClose" type="button" aria-label="关闭放大">×</button>
      <iframe id="lightboxFrame" src="" allowfullscreen title="游戏全屏"></iframe>
    </div>

    <!-- 弹出日志详情 -->
    <div class="log-modal" id="logModal" aria-hidden="true">
      <div class="log-modal-bg" id="logModalBg"></div>
      <div class="log-modal-body">
        <button class="log-modal-close" id="logModalClose" type="button" aria-label="关闭详情">×</button>
        <h2 id="logModalTitle"></h2>
        <p id="logModalDetail"></p>
      </div>
    </div>

    <script src="play.js"></script>
  </body>
</html>
