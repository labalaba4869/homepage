<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>方块拼图 Demo</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        display: grid;
        min-height: 100vh;
        margin: 0;
        place-items: center;
        color: #f7fbff;
        font-family: "Trebuchet MS", "Microsoft YaHei", Arial, sans-serif;
        background:
          radial-gradient(circle at 20% 20%, rgba(255, 79, 216, 0.16), transparent 30%),
          #07111f;
      }

      .demo-shell {
        width: min(100% - 28px, 720px);
        text-align: center;
      }

      h1 {
        margin: 0 0 12px;
        color: #ffd166;
        font-size: clamp(24px, 5vw, 38px);
      }

      p {
        margin: 0 0 20px;
        color: #aab8d0;
      }

      .board {
        display: grid;
        grid-template-columns: repeat(4, minmax(58px, 100px));
        justify-content: center;
        gap: 14px;
        padding: 24px;
        border: 2px solid rgba(32, 244, 255, 0.5);
        border-radius: 8px;
        background: rgba(17, 24, 39, 0.86);
        box-shadow: 0 0 30px rgba(32, 244, 255, 0.2);
      }

      .block {
        aspect-ratio: 1;
        border: 0;
        border-radius: 8px;
        cursor: pointer;
        box-shadow: inset 0 -8px rgba(0, 0, 0, 0.22), 0 10px 20px rgba(0, 0, 0, 0.25);
        transition: transform 0.16s ease, opacity 0.16s ease;
      }

      .block:hover {
        transform: translateY(-5px);
      }

      .block.is-gone {
        opacity: 0;
        pointer-events: none;
        transform: scale(0.82);
      }

      .pink {
        background: #ff4fd8;
      }

      .cyan {
        background: #20f4ff;
      }

      .yellow {
        background: #ffd166;
      }

      .green {
        background: #7cff6b;
      }

      .status {
        min-height: 28px;
        margin-top: 18px;
        color: #20f4ff;
        font-weight: 900;
      }
    </style>
  </head>
  <body>
    <main class="demo-shell">
      <h1>方块拼图 Demo</h1>
      <p>点击彩色方块进行消除。</p>
      <div class="board" aria-label="方块拼图棋盘">
        <button class="block pink" type="button" aria-label="粉色方块"></button>
        <button class="block cyan" type="button" aria-label="青色方块"></button>
        <button class="block yellow" type="button" aria-label="黄色方块"></button>
        <button class="block green" type="button" aria-label="绿色方块"></button>
        <button class="block cyan" type="button" aria-label="青色方块"></button>
        <button class="block yellow" type="button" aria-label="黄色方块"></button>
        <button class="block green" type="button" aria-label="绿色方块"></button>
        <button class="block pink" type="button" aria-label="粉色方块"></button>
      </div>
      <div class="status" id="status">剩余方块：8</div>
    </main>

    <script>
      const blocks = document.querySelectorAll(".block");
      const status = document.querySelector("#status");

      blocks.forEach((block) => {
        block.addEventListener("click", () => {
          block.classList.add("is-gone");
          const left = document.querySelectorAll(".block:not(.is-gone)").length;
          status.textContent = left === 0 ? "全部消除完成！" : `剩余方块：${left}`;
        });
      });
    </script>
  </body>
</html>
