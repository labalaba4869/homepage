<!DOCTYPE html>
<html lang="zh-CN">
  <head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>地牢探索者 Demo</title>
    <style>
      body {
        display: grid;
        min-height: 100vh;
        margin: 0;
        place-items: center;
        color: #f7fbff;
        font-family: "Microsoft YaHei", Arial, sans-serif;
        background: linear-gradient(135deg, #111827, #29163f);
      }

      main {
        width: min(100% - 32px, 720px);
        padding: 42px;
        border: 2px solid rgba(32, 244, 255, 0.45);
        border-radius: 8px;
        text-align: center;
        background: rgba(8, 11, 20, 0.7);
        box-shadow: 0 0 30px rgba(32, 244, 255, 0.16);
      }

      h1 {
        margin: 0 0 12px;
        color: #20f4ff;
      }

      p {
        margin: 0;
        color: #aab8d0;
      }
